# PROFILE: custom (daily driver, latency-optimized)

# Interfaces
upload_interface=eth0
download_interface=nssifb
pinger_method=fping
probe_setuid_fix=0   # daemon runs as root; no need to setuid fping/ping

# Base bandwidths (kbit/s)
upload_base_kbits=80000
download_base_kbits=830000

# Minimum floor percentages
upload_min_percent=60
download_min_percent=60

# Rate adjustment percentages
increase_rate_percent_up=15
decrease_rate_percent_up=12
increase_rate_percent_down=15
decrease_rate_percent_down=12

# Ramp control (hold-down + slow ramp)
hold_after_decrease_ms=600        # after a decrease: no increases for this long, so the queue can drain (0 = off)
slow_increase_percent=2           # increase step used near the rate where bufferbloat last started
ramp_fast_until_percent=90        # normal (fast) step only below 90% of that rate
trouble_memory_s=30               # forget that rate after 30 s without bufferbloat (0 = slow ramp off)
decrease_settle_ms=600            # NEW: after a decrease: no further latency decrease and no load bias for this long (the hold above is
                                  # stretched to at least this, so nothing ratchets up meanwhile). One transient spike used to cost 2-3
                                  # cuts in a row, because the latency reading still shows it after the first cut. A reading above 2x the
                                  # high threshold still cuts at once. 0 = off (v3 behaviour)

# Latency thresholds (ms)
latency_low_up_ms=13
latency_high_up_ms=17
latency_low_down_ms=14
latency_high_down_ms=19

# Latency filter
latency_filter=median
latency_window_size=3
alpha_ewma=0.4

# Probing
probe_ms=200
probe_fast_ms=100
probe_min_ms=100
elastic_probe=1
variance_thresh_ms=2
probe_timeout_ms=100              # fping -t: a reply slower than this counts as "no reply"
probe_blackout_s=3                # no reply at all for this long while a direction carries traffic: count it as a
                                  # probe_timeout_ms reading and let the normal decrease logic run (shorter gaps hold the rates; 0 = always hold)

# Adaptive floor control
# Now OFF (was 1). It raises the floor while latency stays high under load (+step every trigger_count cycles,
# up to _max). With the load measurement fixed (counter_sync_s) it really engages: in a simulated sustained
# capacity drop (70 -> 50 Mbit/s) the floor climbs to 90%, the shaper sits above capacity and latency stays at the
# modem buffer limit (mean 353 ms, vs 16 ms with adaptive_floor=0). Set it back to 1 only if you prefer throughput.
adaptive_floor=0
adaptive_floor_step=3
adaptive_floor_min=60
adaptive_floor_max=90
adaptive_floor_trigger_ms=17   # was 12 (below latency_low); floor now only rises under load + sustained high latency
adaptive_floor_trigger_count=5
adaptive_floor_decay_interval=20
adaptive_floor_decay_step=5

# Load-aware bias
load_aware=1
load_bias_decrease=3
load_bias_threshold_percent=40    # replaces load_bias_threshold_bytes: 'loaded' = measured >= 40% of the shaper rate, per direction
load_bias_max_util_percent=85     # NEW: no load bias once the traffic is >= 85% of the shaper rate (0 = no limit, v3 behaviour). Without it the
                                  # bias kept trimming a Wi-Fi-limited download (~500 Mbit/s) from 830 down to the 498 floor, where the shaper
                                  # itself held a queue and the latency it caused was read as bufferbloat
decrease_min_load_percent=20      # NEW: latency-triggered decrease / floor raise only if that direction carries >= 20% of its rate
apply_min_change_percent=1        # NEW: only call tc when a rate moved >= 1% (or lands exactly on base)

# Logging (level 2 + mode 2 = one tick line and one Counters line per cycle, for testing; use 1/1 for daily use)
log_enabled=1
log_level=2
log_mode=2
log_format=json

# Reflectors
# Add your local Gateway DNS
# test: fping -c 5 x.x.x.x x.x.x.x 
reflectors="1.1.1.1 9.9.9.9 8.8.8.8"
reflector_count=3
reflector_rotation=roundrobin

# ISP cap detection
cap_trigger_cycles=8
cap_threshold_percent=95          # shaper rate (% of base) that counts as "at the cap"
cap_load_percent=90               # ...and that direction must also carry >= 90% of its shaper rate

# Qdisc stats source
qdisc_stats=nssfq_codel

# Qdisc options
eqdisc_opts=limit 350 flows 1024 quantum 304 target 3.5ms interval 50ms
iqdisc_opts=limit 3600 flows 1024 quantum 768 target 3.5ms interval 50ms

# Root burst settings
root_burst_up=32768
root_burst_down=131072

# Throughput smoothing (applied per counter update, see counter_sync_s)
rate_filter=ewma
alpha_rate=0.5
smooth_size=3
counter_sync_s=1.0                # NSS publishes tc counters in ~1 s steps (seen in the logs); 0 = counters are continuous

# Calm-window guard
calm_window_cycles=5
