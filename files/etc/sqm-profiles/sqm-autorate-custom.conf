# PROFILE: custom (daily driver, latency-optimized) - COMPLETE reference
#
# Every key that sqm-autorate.pl reads is in this file, once, with the value you run now. The comment above
# each key says what it does, its accepted range (values outside it are clamped by the script) and the script's
# built-in default (what applies when the key is missing).
#
# File format: key=value, one per line. "#" starts a comment, also after a value (a space before the "#" is
# required there). Quotes around a value are removed. No spaces are needed around "=".
# Active copy: the init and the helpers render this file into /var/sqm-autorate.conf (memory); edit this file,
#              never that one.
# Apply:    sqm-status reload   (or /etc/init.d/sqm-autorate reload; a restart is only needed after a key was
#           added or removed: a reload keeps the previous value of a key that is missing)
# Check:    sqm-status check    and   grep -E 'Config|Shaper|Pinger|Counter|NSS' /var/log/sqm-autorate.log
# Obsolete, do not add: load_bias_threshold_bytes (ignored with a log line; use load_bias_threshold_percent).
# Testing the DSCP classes: log_level=2 and log_mode=2 (see "Logging") give one line per cycle; set them back
# to 1/1 afterwards (sqm-status set log_level 2 does that in memory only).

# ============================================================ Interfaces
# Egress device that nss-rk.qos shapes (the WAN-side eth device). Default eth0 (also used when the name is invalid).
upload_interface=eth0
# NOT READ by the script: the ingress device is always nssifb. Kept as documentation.
download_interface=nssifb

# ============================================================ Pinger
# fping, ping or automatic (script default: automatic = fping when installed, else ping).
pinger_method=fping
# 1 = allow the script to adjust setuid bits on fping/ping so a non-root daemon can run them. Default 0.
probe_setuid_fix=0   # daemon runs as root; no need to setuid fping/ping

# ============================================================ Base bandwidths (kbit/s)
# The rates the shaper starts at and never exceeds. Range 100-10000000. Script defaults 10000 / 50000.
upload_base_kbits=80000
download_base_kbits=830000

# ============================================================ Minimum floors (% of base)
# The shaper never goes below this share of the base rate (adaptive_floor can raise it). Range 0-100.
# Script defaults: up 50, down 55.
upload_min_percent=60
download_min_percent=60

# ============================================================ Rate adjustment (% per step)
# Step sizes of one increase / decrease. Integers. Script defaults: up +15/-6, down +10/-6.
increase_rate_percent_up=15
decrease_rate_percent_up=12
increase_rate_percent_down=15
decrease_rate_percent_down=12

# ============================================================ Ramp control (hold-down + slow ramp)
# After a decrease: no increases for this long, so the queue can drain. Range 0-60000 ms, 0 = off. Default 600.
hold_after_decrease_ms=600
# Increase step (% of the rate) used near the rate where bufferbloat last started. Range 0.1-50. Default 2.0.
slow_increase_percent=2
# The normal (fast) step is only used below this % of that rate. Range 10-100. Default 90.
ramp_fast_until_percent=90
# Forget that rate after this many seconds without bufferbloat. Range 0-86400, 0 = slow ramp off. Default 30.
trouble_memory_s=30
# After a decrease: no further latency decrease and no load bias for this long (the hold above is stretched to at
# least this, so nothing ratchets up meanwhile). One transient spike used to cost 2-3 cuts in a row, because the
# latency reading still shows it after the first cut. Range 0-60000 ms, 0 = off. Default 0.
decrease_settle_ms=600
# ...unless the reading is above this multiple of the high threshold: then it cuts again at once. Range 1.0-100.
# Default 2.0 (set explicitly so that a profile switch cannot carry another profile's value over).
decrease_settle_bypass_factor=2.0

# ============================================================ Latency thresholds (ms)
# Below "low" the rate may rise, above "high" it is cut; in between it holds. low should be below high (a warning
# is logged otherwise). Integers. Script defaults: up 10/15, down 12/20.
latency_low_up_ms=13
latency_high_up_ms=17
latency_low_down_ms=14
latency_high_down_ms=19

# ============================================================ Latency filter
# median or ewma. Default median.
latency_filter=median
# Number of readings in the median window, per direction (not used by ewma). Range 1-20. Default 4.
latency_window_size=3
# EWMA weight of the newest reading, only used with latency_filter=ewma. Range 0.0-1.0. Default 0.4.
alpha_ewma=0.4

# ============================================================ Probing
# Probe interval, normal (ms). Range 100-5000. Default 250.
probe_ms=200
# Faster probe interval used by elastic probing, ms. Range 50-5000, never below probe_min_ms. Default 150.
probe_fast_ms=100
# Lower bound for elastic probing (ms). Range 50-5000. Default 100.
probe_min_ms=100
# 1 = probe at probe_fast_ms instead of probe_ms, but only while a direction is loaded AND the last 4 readings
# spread by more than variance_thresh_ms or the latency is above the low threshold; 0 = always probe_ms. Default 1.
elastic_probe=1
# Spread (max - min of the last 4 raw readings, ms) above which the fast interval is used. Range 1-100. Default 3.
variance_thresh_ms=2
# fping -t: a reply slower than this counts as "no reply". Range 20-1000 ms. Default 100.
probe_timeout_ms=100              # fping -t: a reply slower than this counts as "no reply"
# No reply at all for this long while a direction carries traffic: count it as a probe_timeout_ms reading and let
# the normal decrease logic run (shorter gaps hold the rates). Range 0-3600 s, 0 = always hold. Default 3.
probe_blackout_s=3

# ============================================================ Adaptive floor
# Now OFF (was 1). It raises the floor while latency stays high under load (+step every trigger_count cycles,
# up to _max). With the load measurement fixed (counter_sync_s) it really engages: in a simulated sustained
# capacity drop (70 -> 50 Mbit/s) the floor climbs to 90%, the shaper sits above capacity and latency stays at the
# modem buffer limit (mean 353 ms, vs 16 ms with adaptive_floor=0). Set it back to 1 only if you prefer throughput.
# 1 = on, 0 = off. Script default 1.
adaptive_floor=0
# Floor increase per trigger, in % points. Default 3.
adaptive_floor_step=3
# Lowest / highest floor the adaptive logic may use, in %. Range 0-100 each. Defaults 60 / 90.
adaptive_floor_min=60
adaptive_floor_max=90
# Latency (ms) above which a cycle counts towards a floor raise. Default 15. Should not be below latency_low_up_ms
# (the script warns: idle jitter could raise the floor).
adaptive_floor_trigger_ms=17   # was 12 (below latency_low); floor now only rises under load + sustained high latency
# Consecutive cycles above the trigger before the floor rises. Default 7.
adaptive_floor_trigger_count=5
# Every this many cycles of calm the floor decays by adaptive_floor_decay_step % points. Defaults 60 / 8.
adaptive_floor_decay_interval=20
adaptive_floor_decay_step=5

# ============================================================ Load-aware bias
# 1 = trim a loaded direction by load_bias_decrease % per cycle so the shaper creeps down to what the traffic
# needs. 0 = off. Default 1.
load_aware=1
# While a direction is loaded the shaper is trimmed by this many % per cycle (see load_bias_max_util_percent). Default 2.
load_bias_decrease=3
# "Loaded" = measured throughput >= this % of the current shaper rate, per direction. Range 1-100. Default 40.
load_bias_threshold_percent=40    # replaces load_bias_threshold_bytes: 'loaded' = measured >= 40% of the shaper rate, per direction
# No load bias once the traffic is >= this % of the shaper rate. Range 0-200, 0 = no limit. Default 0.
load_bias_max_util_percent=85     # no load bias once the traffic is >= 85% of the shaper rate (0 = no limit). Without it the
                                  # bias kept trimming a Wi-Fi-limited download (~500 Mbit/s) from 830 down to the 498 floor, where the shaper
                                  # itself held a queue and the latency it caused was read as bufferbloat
# A latency-triggered decrease / floor raise only happens if that direction carries >= this % of its rate.
# Range 0-100. Default 20.
decrease_min_load_percent=20      # latency-triggered decrease / floor raise only if that direction carries >= 20% of its rate
# Only call tc when a rate moved >= this % since the last apply (or lands exactly on base). Range 0-50. Default 1.
apply_min_change_percent=1        # only call tc when a rate moved >= 1% (or lands exactly on base)

# ============================================================ Calm-window guard
# After start / reload: skip rate changes for this many cycles. Range 0-100. Default 5.
calm_window_cycles=5

# ============================================================ ISP cap detection
# Cap detection only LOGS "ISP cap suspected": this many cycles in a row near the cap with stable latency. 0 = off.
# Default 12.
cap_trigger_cycles=8
# A shaper rate at or above this % of base counts as "at the cap". Range 1-100. Default 95.
cap_threshold_percent=95          # shaper rate (% of base) that counts as "at the cap"
# ...and that direction must also carry >= this % of its shaper rate. Range 1-100. Default 90.
cap_load_percent=90               # ...and that direction must also carry >= 90% of its shaper rate

# ============================================================ Reflectors (ping targets)
# Space separated list in quotes. Default: 1.1.1.1 when the key is missing or empty.
# Add your local Gateway DNS
# test: fping -c 5 x.x.x.x x.x.x.x 
reflectors="1.1.1.1 9.9.9.9 8.8.8.8"
# How many reflectors are probed per cycle (taken from the list above). Range 1-10. Default 3.
reflector_count=3
# roundrobin or random. Default roundrobin.
reflector_rotation=roundrobin

# ============================================================ Counters: where the throughput is read from
# nsstbl (root counters, default) or nssfq_codel (the leaf under parent 1:). With the DSCP classes (nssprio under
# the root) there is no such leaf: the script falls back to the nsstbl counters by itself and says so in the log once.
qdisc_stats=nssfq_codel
# 1 (default) = the leaf qdisc (nssfq_codel 10:) is re-sent when its arguments changed; 0 = only the nsstbl rate is
# ever changed. A device whose root has an nssprio (nss_dscp_classes) is detected and its leaf is left alone
# automatically, so 1 is right for the DSCP classes too. Use 0 only for another layout than nss-rk.qos builds.
manage_child=1

# ============================================================ Throughput smoothing (applied per counter update)
# average (window = smooth_size) or ewma (weight = alpha_rate). Default average.
rate_filter=ewma
# EWMA weight, only with rate_filter=ewma. Range 0.0-1.0. Default 0.4.
alpha_rate=0.5
# Window size, only with rate_filter=average. Range 1-50. Default 3.
smooth_size=3
# NSS publishes tc counters in ~1 s steps (seen in the logs). Seconds, range 0-10; 0 = counters are continuous
# (sysfs). Default 1.0.
counter_sync_s=1.0

# ============================================================ Qdisc options for the leaf
# Used when the daemon re-sends the leaf qdisc. Key missing = the eqdisc_opts / iqdisc_opts of the sqm queue
# section of upload_interface (the same strings you have in /etc/config/sqm).
eqdisc_opts=limit 350 flows 1024 quantum 304 target 3.5ms interval 50ms
iqdisc_opts=limit 3600 flows 1024 quantum 768 target 3.5ms interval 50ms

# ============================================================ Root shaper (nsstbl) burst and MTU, in bytes
# auto (or empty, 0, or no key at all) = what nss-rk.qos uses: the MTU of the device (eth0 / nssifb) + the sqm
# 'overhead' option (18 when that is 0), and the burst from the sqm config (root_burst_up / root_burst_down of this
# interface's queue section; unset there too: 1000 us of the base rate, rounded to a multiple of the MTU). A number
# here overrides it. MTU range 128-70000, burst range 1-10000000. The log shows what is used: "Shaper parameters: ...".
root_burst_up=auto
root_burst_down=auto
root_mtu_up=auto
root_mtu_down=auto

# ============================================================ Logging
# 1 = write /var/log/sqm-autorate.log (truncated at 5 MB), 0 = nothing. Default 1.
log_enabled=1
# 0 = errors only, 1 = normal, 2 = also per-cycle details (Counters line, config summary). Default 1.
# Level 2 + mode 2 = one tick line and one Counters line per cycle, for testing; use 1/1 for daily use.
log_level=1
# 0 = silent, 1 = event-driven (a line when a rate changed more than log_change_threshold_percent), 2 = every
# cycle. Default 1.
log_mode=1
# compact, verbose or json. Default compact.
log_format=json
# Only used in log_mode 1: log a rate change when a rate moved more than this many %. Range 0-50. Default 2
# (set explicitly so that a profile switch cannot carry another profile's value over).
log_change_threshold_percent=2
