# PROFILE: gaming (ultra-latency priority)
# Interfaces
upload_interface=eth0
download_interface=nssifb
pinger_method=fping
probe_setuid_fix=1

# Base bandwidths (kbit/s)
upload_base_kbits=80000
download_base_kbits=830000

# Minimum floor percentages
upload_min_percent=50
download_min_percent=60

# Rate adjustment percentages
increase_rate_percent_up=20
decrease_rate_percent_up=10
increase_rate_percent_down=20
decrease_rate_percent_down=15

# Latency thresholds (ms) — ultra-latency tuned
latency_low_up_ms=9
latency_high_up_ms=13
latency_low_down_ms=11
latency_high_down_ms=16

# Latency filter
latency_filter=median
latency_window_size=3
alpha_ewma=0.4

# Probing — fast reaction
probe_ms=150
probe_fast_ms=80
probe_min_ms=80
elastic_probe=1
variance_thresh_ms=2

# Adaptive floor control — ultra-latency tuned
adaptive_floor=1
adaptive_floor_step=2
adaptive_floor_min=50
adaptive_floor_max=68
adaptive_floor_trigger_ms=12
adaptive_floor_trigger_count=4
adaptive_floor_decay_interval=10
adaptive_floor_decay_step=2

# Load-aware bias — stronger clamp
load_aware=1
load_bias_decrease=5
load_bias_threshold_bytes=10000000

# Logging
log_enabled=1
log_level=1
log_mode=1
log_format=json

# Reflectors
# Add your local Gateway DNS alongside 2 stable anycast fallbacks
reflectors="1.1.1.1 9.9.9.9 8.8.8.8"
reflector_count=3
reflector_rotation=roundrobin

# ISP cap detection
cap_trigger_cycles=8
cap_threshold_percent=95

# Qdisc stats source
qdisc_stats=nssfq_codel

# Qdisc options
eqdisc_opts=limit 350 flows 1024 quantum 304 target 3.5ms interval 50ms
iqdisc_opts=limit 3600 flows 1024 quantum 768 target 3.5ms interval 50ms

# Root burst settings
root_burst_up=32768
root_burst_down=131072

# Throughput smoothing — tighter
rate_filter=ewma
alpha_rate=0.6
smooth_size=2

# Calm-window guard
calm_window_cycles=5
