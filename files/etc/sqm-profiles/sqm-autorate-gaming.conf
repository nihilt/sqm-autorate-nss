# PROFILE: gaming (latency-priority, fast recovery)

# Interfaces
upload_interface=eth0
download_interface=nssifb
pinger_method=fping
probe_setuid_fix=1

# Base bandwidths (kbit/s)
upload_base_kbits=83000
download_base_kbits=830000

# Minimum floor percentages
upload_min_percent=50
download_min_percent=55

# Rate adjustment percentages
increase_rate_percent_up=20
decrease_rate_percent_up=15
increase_rate_percent_down=20
decrease_rate_percent_down=15

# Latency thresholds (ms) — aggressive
latency_low_up_ms=8
latency_high_up_ms=12
latency_low_down_ms=10
latency_high_down_ms=15

# Latency filter
latency_filter=median
latency_window_size=3
alpha_ewma=0.4

# Probing — fast reaction
probe_ms=150
probe_fast_ms=80
probe_min_ms=80
elastic_probe=1
variance_thresh_ms=2

# Adaptive floor control — quick decay
adaptive_floor=1
adaptive_floor_step=3
adaptive_floor_min=50
adaptive_floor_max=85
adaptive_floor_trigger_ms=10
adaptive_floor_trigger_count=3
adaptive_floor_decay_interval=15
adaptive_floor_decay_step=3

# Load-aware bias — stronger clamp
load_aware=1
load_bias_decrease=5
load_bias_threshold_bytes=10000000

# Logging
log_enabled=1
log_level=2
log_mode=1
log_format=json

# Reflectors
reflectors="1.1.1.1 9.9.9.9 8.8.8.8 208.67.222.222"
reflector_count=3
reflector_rotation=roundrobin

# ISP cap detection
cap_trigger_cycles=8
cap_threshold_percent=95

# Qdisc stats source
qdisc_stats=nssfq_codel

# Qdisc options
eqdisc_opts=flows 1024 quantum 304 target 3.5ms interval 50ms
iqdisc_opts=flows 1024 quantum 304 target 3.5ms interval 50ms

# Throughput smoothing — tighter
rate_filter=ewma
alpha_rate=0.6
smooth_size=2

# Calm-window guard
calm_window_cycles=3