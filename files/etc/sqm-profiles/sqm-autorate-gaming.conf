# PROFILE: gaming  (lowest latency: fast probes, quick cuts, quick recovery)
#
# Every key the daemon reads is set below, so switching to this profile never leaves a value of the
# previous profile active. Each key is explained in sqm-autorate-custom.conf (same order and names).
# Values this profile does not change are the daemon's built-in defaults. eqdisc_opts and iqdisc_opts
# are left out on purpose: without them the options of /etc/config/sqm are used.
# Status: not tuned against the current daemon. Try it, then: sqm-status check gaming

# ---- Interfaces
upload_interface=eth0
download_interface=nssifb

# ---- Pinger
pinger_method=fping
probe_setuid_fix=0

# ---- Base bandwidths (kbit/s): set these to your plan; they must equal upload / download in /etc/config/sqm
upload_base_kbits=80000
download_base_kbits=830000

# ---- Floors (% of base)
upload_min_percent=50
download_min_percent=60

# ---- Rate steps (% per step)
increase_rate_percent_up=20
decrease_rate_percent_up=10
increase_rate_percent_down=20
decrease_rate_percent_down=15

# ---- Ramp control
hold_after_decrease_ms=600
slow_increase_percent=2.0
ramp_fast_until_percent=90
trouble_memory_s=30
decrease_settle_ms=0
decrease_settle_bypass_factor=2.0

# ---- Latency thresholds (ms)
latency_low_up_ms=9
latency_high_up_ms=13
latency_low_down_ms=11
latency_high_down_ms=16

# ---- Latency filter
latency_filter=median
latency_window_size=3
alpha_ewma=0.4

# ---- Probing
probe_ms=150
probe_fast_ms=80
probe_min_ms=80
elastic_probe=1
variance_thresh_ms=2
probe_timeout_ms=100
probe_blackout_s=3

# ---- Adaptive floor
adaptive_floor=1
adaptive_floor_step=2
adaptive_floor_min=50
adaptive_floor_max=68
adaptive_floor_trigger_ms=12
adaptive_floor_trigger_count=4
adaptive_floor_decay_interval=10
adaptive_floor_decay_step=2

# ---- Load-aware bias
load_aware=1
load_bias_decrease=5
load_bias_threshold_percent=40
load_bias_max_util_percent=0
decrease_min_load_percent=20
apply_min_change_percent=1

# ---- Calm window
calm_window_cycles=5

# ---- ISP cap detection
cap_trigger_cycles=12
cap_threshold_percent=95
cap_load_percent=90

# ---- Reflectors
# Add your local Gateway DNS
# test: fping -c 5 x.x.x.x x.x.x.x
reflectors="1.1.1.1 9.9.9.9 8.8.8.8"
reflector_count=3
reflector_rotation=roundrobin

# ---- Counters
qdisc_stats=nssfq_codel
manage_child=1
rate_filter=ewma
alpha_rate=0.6
smooth_size=2
counter_sync_s=1.0

# ---- Root shaper burst and MTU (auto = what nss-rk.qos uses)
root_burst_up=auto
root_burst_down=auto
root_mtu_up=auto
root_mtu_down=auto

# ---- Logging
log_enabled=1
log_level=1
log_mode=1
log_format=json
log_change_threshold_percent=2
